name: Hourly forecast

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # backup only; cron-job.org triggers this every 10 min
                                         # a forecast is issued once per new hour
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tamb-live
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Forecast
        id: fc
        run: python forecast.py

      - name: Build website
        if: steps.fc.outputs.new == 'true'
        run: python build_site.py

      - name: Commit data
        if: steps.fc.outputs.new == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5
        if: steps.fc.outputs.new == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fc.outputs.new == 'true'
        with:
          path: docs
      - id: deploy
        if: steps.fc.outputs.new == 'true'
        uses: actions/deploy-pages@v4
