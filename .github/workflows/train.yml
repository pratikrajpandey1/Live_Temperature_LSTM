name: Train model

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date of training history (YYYY-MM-DD)"
        default: "2016-01-01"
      hindcast_days:
        description: "Most recent days held out and hindcast for the website"
        default: "14"
  schedule:
    - cron: "41 7 1 * *"      # retrain on the 1st of every month

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tamb-live
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Train
        run: python train.py --start "${{ inputs.start || '2016-01-01' }}" --hindcast-days "${{ inputs.hindcast_days || '14' }}"

      - name: First forecast + website
        run: |
          python forecast.py
          python build_site.py

      - name: Commit model and data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models data docs
          git diff --cached --quiet || git commit -m "retrain model $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
