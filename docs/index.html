["C", "F"].forEach(u => document.getElementById("u" + u).onclick = () => {
  unit = u; try { localStorage.setItem("tamb_unit", u); } catch (e) {} render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
